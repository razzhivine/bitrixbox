name: Матрица редакций и баз данных

# Полный цикл (установка, очистка, диагностика, вход, откат) на всех поддерживаемых сочетаниях.
# Запускается раз в неделю и вручную (Actions → Матрица → Run workflow).
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  e2e:
    name: ${{ matrix.edition }} / ${{ matrix.db }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: start,          db: mysql-8.4,     php: "8.3" }
          - { edition: standard,       db: mysql-8.4,     php: "8.3" }
          - { edition: small_business, db: mysql-8.4,     php: "8.3" }
          - { edition: business,       db: mysql-8.4,     php: "8.3" }
          - { edition: standard,       db: mysql-8.0,     php: "8.3" }
          - { edition: standard,       db: mariadb-11.4,  php: "8.3" }
          - { edition: standard,       db: mariadb-10.11, php: "8.2" }
    steps:
      - uses: actions/checkout@v7

      - name: Сквозная проверка
        env:
          EDITION: ${{ matrix.edition }}
          DB: ${{ matrix.db }}
          PHP: ${{ matrix.php }}
          # диалог с мастером записывается, чтобы сравнить его с tests/fixtures/wizard-<редакция>.jsonl
          BX_WIZARD_RECORD: ${{ runner.temp }}/wizard-${{ matrix.edition }}.jsonl
        run: bash tests/e2e.sh

      - name: Изменился ли мастер установки Битрикса
        if: always() && hashFiles(format('tests/fixtures/wizard-{0}.jsonl', matrix.edition)) != ''
        run: >
          python3 tests/test_wizard.py --diff "$RUNNER_TEMP/wizard-${{ matrix.edition }}.jsonl"
          --against "tests/fixtures/wizard-${{ matrix.edition }}.jsonl"

      - name: Свежая запись мастера (чтобы обновить tests/fixtures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-${{ matrix.edition }}-${{ matrix.db }}-${{ matrix.php }}
          path: ${{ runner.temp }}/wizard-${{ matrix.edition }}.jsonl
          if-no-files-found: ignore
